[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "provn-sdk"
version = "0.6.0"
description = "PROVN AI Agent Governance SDK — cryptographic audit trails, compliance gates, and kill switch in 3 lines"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "PROVN", email = "sdk@provn.ai" }]
keywords = ["ai", "agents", "governance", "compliance", "observability", "eu-ai-act", "dpdp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "urllib3>=1.26",
]

[project.optional-dependencies]
async = ["aiohttp>=3.8"]
dev = ["pytest", "pytest-asyncio", "black", "mypy"]

[project.urls]
Homepage = "https://provn.ai"
Documentation = "https://docs.provn.ai"
Repository = "https://github.com/provn-ai/provn-sdk-python"
"Bug Tracker" = "https://github.com/provn-ai/provn-sdk-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["provn*"]
